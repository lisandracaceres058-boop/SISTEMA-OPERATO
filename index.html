<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Simulación de Partición Dinámica de Memoria RAM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <!-- Header -->
      <header class="mb-8">
        <h1 class="text-4xl font-bold text-gray-800 text-center mb-2">
          Dashboard de Simulación de Partición Dinámica
        </h1>
        <p class="text-center text-gray-600">
          Gestión de Memoria RAM - 1024 KB
        </p>
      </header>

      <!-- Main Dashboard -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Panel Izquierdo - Controles -->
        <div class="lg:col-span-1 space-y-6">
          <!-- Control de Procesos -->
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h2
              class="text-xl font-semibold text-gray-800 mb-4 flex items-center"
            >
              <svg
                class="w-6 h-6 mr-2 text-blue-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
                ></path>
              </svg>
              Control de Procesos
            </h2>

            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                  Nombre del Proceso
                </label>
                <input
                  type="text"
                  id="processName"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                  placeholder="Ej: Chrome, Word, etc."
                />
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                  Tamaño del Proceso (KB)
                </label>
                <input
                  type="number"
                  id="processSize"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                  placeholder="Ej: 128, 256, etc."
                  min="1"
                  max="1024"
                />
              </div>

              <button
                id="allocateBtn"
                class="w-full btn-primary text-white font-semibold py-3 px-4 rounded-lg"
              >
                <span class="flex items-center justify-center">
                  <svg
                    class="w-5 h-5 mr-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 4v16m8-8H4"
                    ></path>
                  </svg>
                  Cargar Proceso
                </span>
              </button>

              <button
                id="compactBtn"
                class="w-full btn-success text-white font-semibold py-3 px-4 rounded-lg"
              >
                <span class="flex items-center justify-center">
                  <svg
                    class="w-5 h-5 mr-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                    ></path>
                  </svg>
                  Compactar Memoria
                </span>
              </button>
            </div>
          </div>

          <!-- Estadísticas -->
          <div class="bg-white rounded-xl shadow-lg p-6">
            <h2
              class="text-xl font-semibold text-gray-800 mb-4 flex items-center"
            >
              <svg
                class="w-6 h-6 mr-2 text-green-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                ></path>
              </svg>
              Estadísticas
            </h2>

            <div class="space-y-3">
              <div class="stat-card p-4 rounded-lg">
                <div class="flex justify-between items-center">
                  <span class="text-sm text-gray-600">Memoria Total</span>
                  <span class="text-lg font-bold text-gray-800" id="totalMemory"
                    >1024 KB</span
                  >
                </div>
              </div>

              <div class="stat-card p-4 rounded-lg">
                <div class="flex justify-between items-center">
                  <span class="text-sm text-gray-600">Memoria Usada</span>
                  <span class="text-lg font-bold text-blue-600" id="usedMemory"
                    >0 KB</span
                  >
                </div>
              </div>

              <div class="stat-card p-4 rounded-lg">
                <div class="flex justify-between items-center">
                  <span class="text-sm text-gray-600">Memoria Libre</span>
                  <span class="text-lg font-bold text-green-600" id="freeMemory"
                    >1024 KB</span
                  >
                </div>
              </div>

              <div class="stat-card p-4 rounded-lg">
                <div class="flex justify-between items-center">
                  <span class="text-sm text-gray-600"
                    >Fragmentación Externa</span
                  >
                  <span
                    class="text-lg font-bold text-orange-600"
                    id="fragmentation"
                    >0 KB</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Panel Derecho - Visualización de Memoria -->
        <div class="lg:col-span-2">
          <div class="bg-white rounded-xl shadow-lg p-6 h-full">
            <h2
              class="text-xl font-semibold text-gray-800 mb-4 flex items-center"
            >
              <svg
                class="w-6 h-6 mr-2 text-purple-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"
                ></path>
              </svg>
              Visualización de Memoria RAM
            </h2>

            <div
              id="memoryContainer"
              class="bg-gray-50 rounded-lg p-4 h-96 overflow-hidden"
            >
              <div class="h-full flex flex-col" id="memoryVisual">
                <!-- Los bloques de memoria se generarán dinámicamente aquí -->
              </div>
            </div>

            <div
              class="mt-4 flex items-center justify-center space-x-6 text-sm"
            >
              <div class="flex items-center">
                <div class="w-4 h-4 occupied-block rounded mr-2"></div>
                <span class="text-gray-600">Ocupado</span>
              </div>
              <div class="flex items-center">
                <div class="w-4 h-4 free-block rounded mr-2"></div>
                <span class="text-gray-600">Libre</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
